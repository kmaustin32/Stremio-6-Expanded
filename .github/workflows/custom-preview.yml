name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    tags: ['custom-v*', 'v*-custom.*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Keep source line endings for version and formatting tests
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Verify version and formatting
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = $metadata.packages | Where-Object name -eq 'stremio-shell-ng'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                 elseif ($package.version -match '-custom\.\d+$') { "v$($package.version)" }
                 else { "custom-v$($package.version)" }
          $version = $tag -replace '^(?:custom-)?v', ''
          if ($package.version -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $($package.version)." }
          "PACKAGE_TAG=$tag" >> $env:GITHUB_ENV
          cargo fmt --all -- --check
      - name: Lint and test Windows
        run: |
          cargo clippy --locked --all -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/ezra-core.test.cjs tests/episode-artwork.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/black_bar_detection.py --dll libmpv-2.dll --ffmpeg bin/ffmpeg.exe
      - name: Install hosted Library compatibility test tools
        run: npm install --prefix .ci-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Test current hosted Library compatibility
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/hosted-library.cjs
      - name: Test manual next-episode popup
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/hosted-next-popup.cjs
      - name: Test hosted artwork fallbacks and spoiler blur
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/hosted-artwork.cjs
      - name: Test Settings updater and Playback Tools
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/hosted-expanded-tools.cjs
      - name: Compile x64 release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package and smoke-test installer and portable app
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: ./setup/package-preview.ps1 -Tag $env:PACKAGE_TAG -SmokeTest
      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-6-Expanded-Windows-x64
          path: preview-output/*
          if-no-files-found: error
      - name: Publish verified release files
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^(?:custom-)?v', ''
          $base = $version.Split('-')[0]
          $title = "Stremio 6 Expanded $base"
          $flags = @('--latest')
          if ($version -match '-custom\.(\d+)$') {
            $title += " Beta $($Matches[1])"
            $flags = @('--prerelease', '--latest=false')
          }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          - **Settings → Help and about:** See the installed Expanded version and check Stable or Beta on GitHub. Downloads are verified before you open the installer. Portable builds get a ZIP.
          - **Playback Tools:** Enhancement adjusts FidelityFX CAS live from 0% to 150%, including with Upscaling set to Off. It starts at 0% and uses GPU Next. The Playback Tools button clears its fill on hover like Skip Outro and keeps the active theme's outline.
          - **Sharpening fixes:** The slider has a stronger effect at 1440p, and holding or dragging it no longer triggers the player's 2× gesture.
          - **Alt+X** toggles Playback Tools during playback, even when the controls are hidden.
          - **Library → Back up lists:** Export custom lists and manual Anime or Live Action choices. Preview and merge a backup on another PC.
          - List restores match renamed lists by their saved IDs first, and Playback Tools reopens if the player rebuilds its controls.
          - The updater, Playback Tools, Library, artwork and manual next-episode prompt are checked daily against the live Stremio interface.

          Use the installer or extract the portable ZIP and run **Stremio 6 Expanded.exe**. Stremio 6 Expanded uses its own app profile. The installer adds its own Start menu entry and downloads WebView2 if needed.

          Windows build and smoke tests: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content -Encoding utf8 $notes
          $prefix = "preview-output/Stremio-6-Expanded-$version-x64"
          $assets = (Get-Item -LiteralPath "$prefix-Setup.exe", "$prefix.zip", 'preview-output/SHA256SUMS.txt').FullName
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag @flags --title $title --notes-file $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
