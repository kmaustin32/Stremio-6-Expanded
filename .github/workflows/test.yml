name: Continuous integration

on: [pull_request, push]

jobs:
  test:
    runs-on: windows-latest
    steps:
    # The Windows runners have autocrlf enabled by default
    # which causes failures for some of rustfmt's line-ending sensitive tests
    - name: disable git eol translation
      run: git config --global core.autocrlf false
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Check version
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-custom.')
      run: node stremiover.js check
    - name: Stable with rustfmt and clippy
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        components: rustfmt, clippy
    - name: Lint code format
      run: cargo fmt --all -- --check
    - name: Lint code
      run: cargo clippy --all -- -D warnings
    - name: Test
      run: cargo test --target x86_64-pc-windows-msvc
    - name: Test Library, playback shortcuts and episode artwork logic
      run: node --test tests/ezra-core.test.cjs tests/episode-artwork.test.cjs
    - name: Install hosted Library compatibility test tools
      run: npm install --prefix .ci-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
    - name: Test current hosted Library compatibility
      env:
        NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
      run: node tests/hosted-library.cjs
    - name: Test manual next-episode popup
      env:
        NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
      run: node tests/hosted-next-popup.cjs
    - name: Test hosted artwork fallbacks and spoiler blur
      env:
        NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
      run: node tests/hosted-artwork.cjs
    - name: Test Settings updater and Playback Tools
      env:
        NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
      run: node tests/hosted-expanded-tools.cjs
    - name: Test black-bar detection and rendered blur
      run: python tests/black_bar_detection.py --dll libmpv-2.dll --ffmpeg bin/ffmpeg.exe

